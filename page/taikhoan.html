<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tài khoản</title>
</head>
<body>
    <nav>
        <button>Thông tin tài khoản</button>
        <button>Vé của tôi</button>
        <button>Sự kiện đã đăng ký</button>
    </nav>
    <main class="main-content">
        <section class="infor">
            <h2>Thông tin tài khoản</h2>
            <div>
                <label for="name">Họ và tên </label>
                <input type="text" name="name"> 
            </div>
            <div>
                <label for="phonenumber">Số điện thoại</label>
                <input type="text" name="phonenumber">
            </div>
            <div>
                <label for="Email">Email</label>
                <input type="text" name="Email">
            </div>
            <div>
                <label for="DoB">Ngày tháng năm sinh</label>
                <input type="text" name="DoB">
            </div>
            <div>
                <label for="sex">Giới tính</label>
                <input type="text" name="sex">
            </div>
        </section>
        <section hidden class="ticket" >
            <h2>Vé của tôi</h2>
            <button>Đã mua</button>
            <button>Đang xử lý</button>
            <button>Đã hủy</button>
        </section>
        <section hidden class="event">
            <h2>Sự kiện đã đăng ký</h2>
            <button>Đang diễn ra</button>
            <button>Sắp diễn ra</button>
            <button>Đã hủy đăng ký</button>
            <button>Đã kết thúc</button>
        </section>
    </main>
</body>
</html>
